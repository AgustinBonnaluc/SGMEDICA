# Bases de datos del proyecto
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_datos:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_datos:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_datos:
  mongo_datos:
